<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>参考曲线校对</title>
<style>
  :root {
    --bg: #f6f8fa; --surface: #fff; --ink: #18212b; --muted: #6b7a8c;
    --line: #dde4ec; --accent: #2f6f6a; --valence: #2f6f6a; --arousal: #c06a3f;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.6 "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    padding: 24px 20px 80px; }
  .wrap { max-width: 1000px; margin: 0 auto; }
  h1 { font-size: 21px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; font-size: 13px; }
  .bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 20px; }
  input[type=password] { font: inherit; padding: 7px 11px; border: 1px solid var(--line);
    border-radius: 6px; min-width: 300px; }
  button { font: inherit; padding: 7px 14px; border: 1px solid var(--line);
    border-radius: 6px; background: var(--surface); cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .5; cursor: default; }
  .err { color: #b3261e; margin: 12px 0; }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
    padding: 18px 20px; margin-bottom: 18px; }
  .head { display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; margin-bottom: 12px; }
  .head strong { font-size: 17px; }
  .tag { font-size: 11px; padding: 2px 8px; border-radius: 10px;
    border: 1px solid var(--muted); color: var(--muted); }
  .media { display: grid; grid-template-columns: minmax(0, 320px) 1fr; gap: 18px;
    align-items: start; }
  @media (max-width: 720px) { .media { grid-template-columns: 1fr; } }
  video, audio { width: 100%; border-radius: 8px; background: #101816; }
  .words { background: #101816; color: #8fa89d; border-radius: 8px; padding: 14px;
    font-size: 16px; line-height: 1.7; max-height: 220px; overflow-y: auto; }
  .words .said { color: #fff; }
  .charts { display: grid; gap: 10px; }
  .chart { position: relative; }
  .chart h4 { margin: 0 0 4px; font-size: 12px; letter-spacing: .06em; color: var(--muted);
    font-weight: 500; text-transform: uppercase; }
  canvas { width: 100%; height: 96px; display: block; border: 1px solid var(--line);
    border-radius: 6px; background: #fbfcfd; }
  .stat { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

  .notes { margin-top: 16px; display: grid; gap: 14px; }
  .note-block { border-top: 1px solid var(--line); padding-top: 12px; }
  .note-block h5 { margin: 0 0 8px; font-size: 13px; }
  .note-block h5 .swatch { display: inline-block; width: 10px; height: 10px;
    border-radius: 2px; margin-right: 6px; vertical-align: baseline; }
  .langs { display: grid; gap: 8px; }
  label { display: grid; gap: 3px; font-size: 12px; color: var(--muted); }
  textarea { font: inherit; font-size: 13px; padding: 8px 10px; border: 1px solid var(--line);
    border-radius: 6px; resize: vertical; min-height: 62px; color: var(--ink); }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .row { display: flex; gap: 10px; align-items: center; margin-top: 8px; }
  .saved { color: var(--accent); font-size: 12px; }
  .gap { margin-left: 8px; font-size: 11px; padding: 1px 7px; border-radius: 9px;
    background: #fbf0e6; color: #a2531f; font-weight: 400; }
</style>
</head>
<body>
<div class="wrap">
  <h1>参考曲线校对</h1>
  <p class="sub">媒体、你标出来的曲线、给标注者看的解释，摆在一起。改完按保存，只写文字，曲线不动。</p>

  <div class="bar">
    <input type="password" id="token" placeholder="管理员令牌" autocomplete="off">
    <button class="primary" id="load">载入</button>
    <span class="stat" id="count"></span>
  </div>
  <div class="err" id="err"></div>
  <div id="list"></div>
</div>

<script>
// 页面挂在 /annotation/api/admin/reference/ui，素材在 /annotation/pool/…
// 从自己的路径推出前缀，换部署路径时不用改代码。
const ROOT = location.pathname.replace(/\/api\/admin\/reference\/ui\/?$/, "");
const API = ROOT + "/api/admin";
const DIM = { valence: "效价 Valence", arousal: "唤醒 Arousal" };
const COLOUR = { valence: "#2f6f6a", arousal: "#c06a3f" };
const MODALITY = { face: "仅面部", body: "仅肢体", audio: "仅音频",
                   text: "仅文本", audiovisual: "完整视频" };

const $ = (id) => document.getElementById(id);
const token = () => $("token").value.trim();

try { $("token").value = sessionStorage.getItem("xmer-admin") || ""; } catch {}

$("load").onclick = load;

async function load() {
  $("err").textContent = "";
  $("list").innerHTML = "";
  try { sessionStorage.setItem("xmer-admin", token()); } catch {}
  let data;
  try {
    const response = await fetch(API + "/reference", {
      headers: { Authorization: "Bearer " + token() },
    });
    if (!response.ok) throw new Error("HTTP " + response.status);
    data = await response.json();
  } catch (error) {
    $("err").textContent = "载入失败：" + error.message;
    return;
  }
  $("count").textContent = data.tasks.length + " 个子任务";
  for (const task of data.tasks) $("list").append(card(task));
}

function card(task) {
  const node = document.createElement("section");
  node.className = "card";

  const head = document.createElement("div");
  head.className = "head";
  head.innerHTML =
    `<strong>${task.display_id || task.task_id}</strong>` +
    `<span class="tag">${MODALITY[task.modality] || task.modality}</span>` +
    `<span class="stat">${task.source_id} · ${task.duration.toFixed(2)}s</span>`;
  node.append(head);

  const media = document.createElement("div");
  media.className = "media";
  const stage = document.createElement("div");
  const charts = document.createElement("div");
  charts.className = "charts";
  media.append(stage, charts);
  node.append(media);

  const player = buildStage(stage, task);

  for (const trace of task.traces) {
    const box = document.createElement("div");
    box.className = "chart";
    const stats = summarise(trace.points);
    box.innerHTML =
      `<h4>${DIM[trace.dimension] || trace.dimension}</h4>` +
      `<div class="stat">起 ${fmt(stats.start)} · 终 ${fmt(stats.end)} · ` +
      `幅 ${fmt(stats.lo)}…${fmt(stats.hi)} · 转向 ${stats.turns} · ${trace.points.length} 点</div>`;
    const canvas = document.createElement("canvas");
    box.append(canvas);
    charts.append(box);
    // 画布要先进入文档才有 clientWidth，否则宽度算成 0
    requestAnimationFrame(() => draw(canvas, trace, task.duration, player));
  }

  node.append(notes(task));
  return node;
}

/** 按模态搭出播放器。text 没有画面，用逐词点亮代替。 */
function buildStage(stage, task) {
  if (task.modality === "text") {
    const words = document.createElement("div");
    words.className = "words";
    words.textContent = "载入中…";
    const audio = document.createElement("audio");
    audio.controls = true;
    stage.append(words, audio);
    fetch(ROOT + task.src)
      .then((r) => r.json())
      .then((doc) => {
        words.textContent = "";
        const spans = [];
        for (const sentence of doc.sentences)
          for (const item of sentence.tokens) {
            const span = document.createElement("span");
            span.textContent = (spans.length ? " " : "") + item.text;
            spans.push({ span, at: item.start });
            words.append(span);
          }
        audio.src = silence(doc.duration);
        audio.ontimeupdate = () => {
          for (const row of spans)
            row.span.className = row.at <= audio.currentTime ? "said" : "";
        };
      })
      .catch(() => { words.textContent = "转录稿载入失败"; });
    return audio;
  }
  const player = document.createElement(
    task.modality === "audio" ? "audio" : "video",
  );
  player.controls = true;
  player.src = ROOT + task.src;
  if (task.modality !== "audio") player.playsInline = true;
  stage.append(player);
  return player;
}

/** 一段静音 wav，给文本模态当时间轴——文本没有自己的媒体。 */
function silence(duration) {
  const rate = 8000, count = Math.ceil(duration * rate);
  const buffer = new ArrayBuffer(44 + count), view = new DataView(buffer);
  const word = (at, text) => [...text].forEach((c, i) => view.setUint8(at + i, c.charCodeAt(0)));
  word(0, "RIFF"); view.setUint32(4, 36 + count, true); word(8, "WAVE");
  word(12, "fmt "); view.setUint32(16, 16, true); view.setUint16(20, 1, true);
  view.setUint16(22, 1, true); view.setUint32(24, rate, true);
  view.setUint32(28, rate, true); view.setUint16(32, 1, true);
  view.setUint16(34, 8, true); word(36, "data"); view.setUint32(40, count, true);
  for (let i = 0; i < count; i += 1) view.setUint8(44 + i, 128);
  return URL.createObjectURL(new Blob([buffer], { type: "audio/wav" }));
}

function fmt(value) {
  return (value >= 0 ? "+" : "") + value.toFixed(2);
}

/** 转向次数用 0.15 的迟滞过滤，否则手抖也算一次转向。 */
function summarise(points) {
  if (!points.length) return { start: 0, end: 0, lo: 0, hi: 0, turns: 0 };
  const values = points.map((p) => p.v);
  let turns = 0, direction = 0, reference = values[0];
  for (const value of values) {
    if (value - reference > 0.15 && direction <= 0) { turns += 1; direction = 1; reference = value; }
    else if (reference - value > 0.15 && direction >= 0) { turns += 1; direction = -1; reference = value; }
    else if (direction > 0 && value > reference) reference = value;
    else if (direction < 0 && value < reference) reference = value;
  }
  return {
    start: values[0], end: values[values.length - 1],
    lo: Math.min(...values), hi: Math.max(...values),
    turns: Math.max(turns - 1, 0),
  };
}

function draw(canvas, trace, duration, player) {
  const ratio = Math.min(devicePixelRatio || 1, 2);
  canvas.width = canvas.clientWidth * ratio;
  canvas.height = canvas.clientHeight * ratio;
  const context = canvas.getContext("2d");
  const pad = 6 * ratio;
  const x = (t) => pad + (t / duration) * (canvas.width - 2 * pad);
  const y = (v) => canvas.height / 2 - (v * (canvas.height / 2 - pad));

  const paint = () => {
    context.clearRect(0, 0, canvas.width, canvas.height);
    // 零线与 ±1 边界：没有刻度的曲线看不出幅度
    context.strokeStyle = "#e3e9ef";
    context.lineWidth = 1 * ratio;
    for (const value of [1, 0, -1]) {
      context.beginPath();
      context.moveTo(pad, y(value));
      context.lineTo(canvas.width - pad, y(value));
      context.stroke();
    }
    context.strokeStyle = COLOUR[trace.dimension] || "#333";
    context.lineWidth = 1.8 * ratio;
    context.beginPath();
    trace.points.forEach((point, index) => {
      const px = x(point.t), py = y(point.v);
      index ? context.lineTo(px, py) : context.moveTo(px, py);
    });
    context.stroke();
    if (player && !player.paused) {
      context.strokeStyle = "#18212b";
      context.beginPath();
      context.moveTo(x(player.currentTime), pad);
      context.lineTo(x(player.currentTime), canvas.height - pad);
      context.stroke();
    }
  };
  paint();
  if (player) {
    player.addEventListener("timeupdate", paint);
    player.addEventListener("pause", paint);
    player.addEventListener("play", function tick() {
      paint();
      if (!player.paused) requestAnimationFrame(tick);
    });
  }
}

function notes(task) {
  const wrap = document.createElement("div");
  wrap.className = "notes";
  for (const trace of task.traces) {
    const block = document.createElement("div");
    block.className = "note-block";
    const colour = COLOUR[trace.dimension] || "#333";
    const blank = ["zh", "en", "fi"].filter((k) => !trace["note_" + k]);
    block.innerHTML =
      `<h5><span class="swatch" style="background:${colour}"></span>` +
      `${DIM[trace.dimension] || trace.dimension} · 解释` +
      (blank.length ? `<span class="gap">缺 ${blank.join(" / ")}</span>` : "") +
      `</h5>`;

    const langs = document.createElement("div");
    langs.className = "langs";
    const fields = {};
    for (const [key, label] of [["zh", "中文"], ["en", "English"], ["fi", "Suomi"]]) {
      const field = document.createElement("label");
      const area = document.createElement("textarea");
      area.value = trace["note_" + key] || "";
      field.append(label, area);
      fields[key] = area;
      langs.append(field);
    }
    block.append(langs);

    const row = document.createElement("div");
    row.className = "row";
    const save = document.createElement("button");
    save.textContent = "保存";
    const flag = document.createElement("span");
    flag.className = "saved";
    save.onclick = async () => {
      const wiping = ["zh", "en", "fi"].filter(
        (key) => trace["note_" + key] && !fields[key].value.trim(),
      );
      if (wiping.length &&
          !confirm(`这会清空已有的 ${wiping.join(" / ")} 解释，确定吗？`)) return;
      save.disabled = true;
      flag.textContent = "";
      try {
        const response = await fetch(
          `${API}/reference/${encodeURIComponent(task.task_id)}/${trace.dimension}`,
          {
            method: "PUT",
            headers: {
              "Content-Type": "application/json",
              Authorization: "Bearer " + token(),
            },
            body: JSON.stringify({
              note_zh: fields.zh.value,
              note_en: fields.en.value,
              note_fi: fields.fi.value,
            }),
          },
        );
        if (!response.ok) throw new Error("HTTP " + response.status);
        for (const key of ["zh", "en", "fi"])
          trace["note_" + key] = fields[key].value.trim() || null;
        flag.textContent = "已保存";
      } catch (error) {
        flag.textContent = "保存失败：" + error.message;
      } finally {
        save.disabled = false;
      }
    };
    row.append(save, flag);
    block.append(row);
    wrap.append(block);
  }
  return wrap;
}
</script>
</body>
</html>
